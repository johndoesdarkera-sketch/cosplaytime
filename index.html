<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Inventory Management</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 900px; width: 100%; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.5rem; color: var(--accent); }
    
    .btn { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); padding: 24px; border-radius: 8px; border: 1px solid var(--border); width: 100%; max-width: 400px; }
    .modal-content h2 { margin-bottom: 16px; }

    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.85rem; color: var(--text-muted); }
    input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; font-size: 1rem; }
    input:focus { outline: 1px solid var(--accent); }

    .panel { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 24px; }
    .panel h2 { font-size: 1.2rem; margin-bottom: 16px; }

    .grid-form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; align-items: end; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
    
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .in-stock { background: #166534; color: #4ade80; }
    .out-stock { background: #991b1b; color: #fca5a5; }
    
    .hidden { display: none !important; }
    .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 8px; }
    .hint { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Storefront Inventory</h1>
      <button id="authBtn" class="btn" onclick="openLogin()">Owner Login</button>
    </header>

    <!-- Owner Dashboard Form -->
    <div id="ownerPanel" class="panel hidden">
      <h2>Add New Item to Inventory</h2>
      <form id="addItemForm" class="grid-form" onsubmit="handleAddProduct(event)">
        <div>
          <label>Item Name</label>
          <input type="text" id="itemName" required placeholder="e.g. Spider-Man Action Figure">
        </div>
        <div>
          <label>Price ($)</label>
          <input type="number" id="itemPrice" step="0.01" min="0" required placeholder="19.99">
        </div>
        <div>
          <label>Stock Qty</label>
          <input type="number" id="itemStock" min="0" required placeholder="10">
        </div>
        <button type="submit" class="btn">Add Item</button>
      </form>
    </div>

    <!-- Inventory Table -->
    <div class="panel">
      <h2>Current Inventory</h2>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Stock Status</th>
            <th class="owner-col hidden">Actions</th>
          </tr>
        </thead>
        <tbody id="inventoryList">
          <tr>
            <td colspan="4" style="text-align: center; color: var(--text-muted);">No products added yet. Log in as owner to add items.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Owner Login</h2>
      <form onsubmit="handleLogin(event)">
        <div>
          <label>Master Password</label>
          <input type="password" id="passwordInput" required>
          <div class="hint">Password suggestion: <b>StoreOwner2026!</b></div>
        </div>
        <div id="loginError" class="error-msg hidden">Incorrect password. Try again.</div>
        <button type="submit" class="btn" style="margin-top: 8px;">Login</button>
        <button type="button" class="btn btn-danger" onclick="closeLogin()" style="margin-top: 4px;">Cancel</button>
      </form>
    </div>
  </div>

  <script>
    // Configuration
    const MASTER_PASSWORD = "StoreOwner2026!"; // Strong yet easy to remember
    let isLoggedIn = false;
    let products = [];

    function openLogin() {
      if (isLoggedIn) {
        logout();
      } else {
        document.getElementById('loginModal').classList.add('active');
        document.getElementById('passwordInput').value = '';
        document.getElementById('loginError').classList.add('hidden');
      }
    }

    function closeLogin() {
      document.getElementById('loginModal').classList.remove('active');
    }

    function handleLogin(e) {
      e.preventDefault();
      const input = document.getElementById('passwordInput').value;
      
      if (input === MASTER_PASSWORD) {
        isLoggedIn = true;
        closeLogin();
        updateUI();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    function logout() {
      isLoggedIn = false;
      updateUI();
    }

    function handleAddProduct(e) {
      e.preventDefault();
      const name = document.getElementById('itemName').value;
      const price = parseFloat(document.getElementById('itemPrice').value).toFixed(2);
      const stock = parseInt(document.getElementById('itemStock').value, 10);

      products.push({ id: Date.now(), name, price, stock });
      document.getElementById('addItemForm').reset();
      renderInventory();
    }

    function deleteProduct(id) {
      products = products.filter(p => p.id !== id);
      renderInventory();
    }

    function renderInventory() {
      const tbody = document.getElementById('inventoryList');
      
      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${isLoggedIn ? 4 : 3}" style="text-align: center; color: var(--text-muted);">No products in stock.</td></tr>`;
        return;
      }

      tbody.innerHTML = products.map(p => `
        <tr>
          <td><strong>${escapeHtml(p.name)}</strong></td>
          <td>$${p.price}</td>
          <td>
            <span class="status-badge ${p.stock > 0 ? 'in-stock' : 'out-stock'}">
              ${p.stock > 0 ? `${p.stock} In Stock` : 'Out of Stock'}
            </span>
          </td>
          ${isLoggedIn ? `<td><button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.8rem;" onclick="deleteProduct(${p.id})">Delete</button></td>` : ''}
        </tr>
      `).join('');
    }

    function updateUI() {
      const authBtn = document.getElementById('authBtn');
      const ownerPanel = document.getElementById('ownerPanel');
      const ownerCols = document.querySelectorAll('.owner-col');

      if (isLoggedIn) {
        authBtn.textContent = 'Logout';
        authBtn.classList.add('btn-danger');
        ownerPanel.classList.remove('hidden');
        ownerCols.forEach(col => col.classList.remove('hidden'));
      } else {
        authBtn.textContent = 'Owner Login';
        authBtn.classList.remove('btn-danger');
        ownerPanel.classList.add('hidden');
        ownerCols.forEach(col => col.classList.add('hidden'));
      }
      
      renderInventory();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[match]);
    }
  </script>
</body>
</html>
