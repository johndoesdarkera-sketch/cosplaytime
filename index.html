<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storefront & Inventory Management</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --border: #334155;
      --card-border: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; display: flex; justify-content: center; }
    .container { max-width: 1000px; width: 100%; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.8rem; color: var(--accent); }
    
    .btn { background: var(--accent); color: #000; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }

    /* Store Grid (Original UI Layout) */
    .section-title { font-size: 1.4rem; margin-bottom: 16px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .product-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .product-card .price { font-size: 1.25rem; font-weight: bold; color: var(--accent); margin-bottom: 8px; }
    .product-card .stock { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
    
    .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .in-stock { background: #166534; color: #4ade80; }
    .out-stock { background: #991b1b; color: #fca5a5; }

    /* Owner Controls Panel */
    .panel { background: var(--card-bg); padding: 24px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 32px; }
    .panel h2 { font-size: 1.3rem; margin-bottom: 16px; }
    .grid-form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; align-items: end; }

    /* Modal Styling */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); padding: 24px; border-radius: 8px; border: 1px solid var(--border); width: 100%; max-width: 380px; }
    .modal-content h2 { margin-bottom: 16px; }

    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 0.85rem; color: var(--text-muted); }
    input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; font-size: 1rem; }
    input:focus { outline: 1px solid var(--accent); }

    .hidden { display: none !important; }
    .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 4px; }
    .card-actions { display: flex; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Storefront</h1>
      <button id="authBtn" class="btn" onclick="openLogin()">Owner Login</button>
    </header>

    <!-- Owner Dashboard Form -->
    <div id="ownerPanel" class="panel hidden">
      <h2>Add New Stock</h2>
      <form id="addItemForm" class="grid-form" onsubmit="handleAddProduct(event)">
        <div>
          <label>Item Name</label>
          <input type="text" id="itemName" required placeholder="Item name...">
        </div>
        <div>
          <label>Price ($)</label>
          <input type="number" id="itemPrice" step="0.01" min="0" required placeholder="0.00">
        </div>
        <div>
          <label>Stock Qty</label>
          <input type="number" id="itemStock" min="0" required placeholder="0">
        </div>
        <button type="submit" class="btn">Add Item</button>
      </form>
    </div>

    <!-- Store Front Grid (Original UI Structure) -->
    <h2 class="section-title">Available Products</h2>
    <div id="productGrid" class="product-grid">
      <!-- Cards render here dynamically -->
    </div>
  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Owner Access</h2>
      <form onsubmit="handleLogin(event)">
        <div>
          <label>Master Password</label>
          <input type="password" id="passwordInput" required autofocus>
        </div>
        <div id="loginError" class="error-msg hidden">Incorrect password. Access denied.</div>
        <button type="submit" class="btn" style="margin-top: 8px;">Login</button>
        <button type="button" class="btn btn-danger" onclick="closeLogin()">Cancel</button>
      </form>
    </div>
  </div>

  <script>
    const MASTER_PASSWORD = "StoreOwner2026!"; 
    let isLoggedIn = false;
    let products = [];

    function openLogin() {
      if (isLoggedIn) {
        logout();
      } else {
        document.getElementById('loginModal').classList.add('active');
        document.getElementById('passwordInput').value = '';
        document.getElementById('loginError').classList.add('hidden');
      }
    }

    function closeLogin() {
      document.getElementById('loginModal').classList.remove('active');
    }

    function handleLogin(e) {
      e.preventDefault();
      const input = document.getElementById('passwordInput').value;
      
      if (input === MASTER_PASSWORD) {
        isLoggedIn = true;
        closeLogin();
        updateUI();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    function logout() {
      isLoggedIn = false;
      updateUI();
    }

    function handleAddProduct(e) {
      e.preventDefault();
      const name = document.getElementById('itemName').value;
      const price = parseFloat(document.getElementById('itemPrice').value).toFixed(2);
      const stock = parseInt(document.getElementById('itemStock').value, 10);

      products.push({ id: Date.now(), name, price, stock });
      document.getElementById('addItemForm').reset();
      renderStore();
    }

    function deleteProduct(id) {
      products = products.filter(p => p.id !== id);
      renderStore();
    }

    function renderStore() {
      const grid = document.getElementById('productGrid');
      
      if (products.length === 0) {
        grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1;">No products available. Log in as owner to add inventory.</p>`;
        return;
      }

      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <div>
            <h3>${escapeHtml(p.name)}</h3>
            <div class="price">$${p.price}</div>
            <div class="stock">
              <span class="status-badge ${p.stock > 0 ? 'in-stock' : 'out-stock'}">
                ${p.stock > 0 ? `${p.stock} units in stock` : 'Out of Stock'}
              </span>
            </div>
          </div>
          ${isLoggedIn ? `
            <div class="card-actions">
              <button class="btn btn-danger" style="width: 100%; font-size: 0.85rem; padding: 6px;" onclick="deleteProduct(${p.id})">Remove Item</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function updateUI() {
      const authBtn = document.getElementById('authBtn');
      const ownerPanel = document.getElementById('ownerPanel');

      if (isLoggedIn) {
        authBtn.textContent = 'Logout Owner';
        authBtn.classList.add('btn-danger');
        ownerPanel.classList.remove('hidden');
      } else {
        authBtn.textContent = 'Owner Login';
        authBtn.classList.remove('btn-danger');
        ownerPanel.classList.add('hidden');
      }
      
      renderStore();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[match]);
    }

    // Initial render
    renderStore();
  </script>
</body>
</html>
